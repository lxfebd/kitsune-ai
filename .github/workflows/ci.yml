name: CI
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # uiohook-napi 等原生模块在 Linux 编译需 X11 开发头文件
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config build-essential

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  build-test:
    name: Build Test (${{ matrix.app_name }})
    strategy:
      matrix:
        include:
          - app_name: stage-web
            command: pnpm -F @kitsune/stage-web run build

          - app_name: stage-tamagotchi
            command: pnpm -F @kitsune/stage-tamagotchi run build

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Turborepo
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # uiohook-napi 等原生模块在 Linux 编译需 X11 开发头文件
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config build-essential

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages

      - name: Build App
        run: ${{ matrix.command }}

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Turborepo
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # uiohook-napi 等原生模块在 Linux 编译需 X11 开发头文件
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config build-essential

      - run: pnpm install --frozen-lockfile

      - name: Setup Playwright
        run: npx playwright install chromium

      - run: pnpm run build:packages
      - run: pnpm run test:run

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node.js
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # uiohook-napi 等原生模块在 Linux 编译需 X11 开发头文件
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev pkg-config build-essential

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
