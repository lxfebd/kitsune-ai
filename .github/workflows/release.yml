name: Release

# 构建并发布桌面安装包到 GitHub Release，供 electron-updater 自动更新。
# 触发方式：
#   - 推送 tag（v*）→ 自动构建并发布（Windows + Linux）
#   - 手动 workflow_dispatch → 选择目标平台（默认不发布，仅构建验证）
#
# 并行发布竞态说明：Windows 与 Linux 若并行执行 electron-builder --publish always，
# 会在同一 tag 下抢建 Release 草稿，导致重复/破碎的 Release。因此这里拆为两个独立
# job，build-linux 显式 depends on build-win，保证同一版本下按顺序只有一个 job 做上传。

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      target:
        description: '要构建的目标平台'
        required: true
        default: 'win'
        type: choice
        options:
          - win
          - linux
          - all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Turborepo
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # Windows 需要 VS Build Tools 编译原生模块（uiohook-napi、koffi 等）
      - name: Install native build tools (Windows)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build packages
        run: pnpm run build:packages

      # tag 触发：electron-builder --publish always 自动创建/复用 tag 的 Release 并上传
      # Windows 安装包与 latest.yml。手动触发：仅构建，不发布。
      - name: Build App — Windows
        run: pnpm -F @kitsune/stage-tamagotchi run build:win ${{ startsWith(github.ref, 'refs/tags/v') && '-- --publish always' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # 手动触发时把安装包传到 Artifacts 供下载校验。
      - name: Upload artifacts (Windows) — manual
        if: startsWith(github.ref, 'refs/tags/v') != true
        uses: actions/upload-artifact@v4
        with:
          name: kitsune-ai-win-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            apps/stage-tamagotchi/dist/*

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    # 依赖 Windows 完成后再构建，保证同一 tag 只有一个 job 在创建/上传 Release，避免竞态。
    needs: build-win

    steps:
      - uses: actions/checkout@v6

      # Turborepo
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # Linux 需要 X11/Xrandr 头文件编译 uiohook-napi 等原生模块
      - name: Install native build deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxrandr-dev pkg-config build-essential

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build App — Linux
        run: pnpm -F @kitsune/stage-tamagotchi run build:linux ${{ startsWith(github.ref, 'refs/tags/v') && '-- --publish always' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发时把安装包传到 Artifacts 供下载校验。
      - name: Upload artifacts (Linux) — manual
        if: startsWith(github.ref, 'refs/tags/v') != true
        uses: actions/upload-artifact@v4
        with:
          name: kitsune-ai-linux-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            apps/stage-tamagotchi/dist/*