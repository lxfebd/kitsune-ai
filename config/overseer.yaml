# Overseer 监工配置 — 单一数据源
#
# 一份配置同时驱动三处，消灭「工具清单三套各说各话」的漂移：
#   1. 感知层：Supervisor 用 detect 段探测各 agent 是否在跑
#   2. 执行层：cli 段注册进 TaskPusher 运行时注册表（可派活），
#      perceiveOnly: true 或没有 cli 段的工具只感知、不派活
#   3. 编排层：coordinator/规划器从 tools[] 动态生成「可用工具清单」，
#      不再硬编码 claude/codex/aider/vscode/intellij
#
# personality: 子 agent 画像（谁擅长什么），供 coordinator 拆活派活时选人。

version: 1
enabled: true
# CLI 任务的合法 cwd 根目录，空数组=不限制（默认不限制，保持向后兼容）
allowedRoots: []
# 监控器轮询间隔（毫秒）
pollInterval: 10000

# ── 操作指导（guidance）──
# 同类工具失败反复出现时（如 ZCode 的 File has not been read yet），桌宠基于内置规则库
# 给出可操作的修复步骤，以事件流卡片 + 桌宠反应呈现（无系统弹窗）。
guidance:
  # 是否启用操作指导（设置页可运行时开关）
  enabled: true
  # 指导语言（zh-Hans / en），内置规则库双语内嵌，按此取文案
  locale: zh-Hans
  # 同一失败（source + 归一化错误信息）在窗口内累计多少次触发指导
  threshold: 3
  # 失败计数窗口（毫秒）— 窗口内未凑满阈值则重置
  windowMs: 900000
  # 同一条规则两次指导的最小间隔（毫秒）— 防刷屏
  cooldownMs: 600000

# ── 执行器参数（原来散落在代码里的硬编码，全部收进这里）──
executor:
  # 并行执行的最大任务数（loop 默认 maxConcurrency）
  maxConcurrency: 3
  # 非关键任务失败后的重试延迟（毫秒，依次递增）
  retryDelaysMs: [2000, 4000, 8000]
  # 子计划最大嵌套深度
  maxSubPlanDepth: 3
  # 动态调整（失败→替代任务）最大轮数
  maxAdjustments: 3
  # 单个计划任务总数上限
  maxTasks: 20
  # CLI 任务默认超时（毫秒）— 单任务未配 timeoutMs 时生效
  cliTimeoutMs: 120000
  # 桌面自动化任务外层硬超时（毫秒）
  desktopTimeoutMs: 60000
  # IDE 任务按 action 超时（毫秒）
  ideTimeoutMs:
    open_file: 10000
    insert_code: 20000
    run_command: 60000

tools:
  # ── dsh（DeepSeek Harness）— 唯一的 CLI 派活入口 ──
  # 「只用 dsh，安装即启用」：dsh 装上（二进制进 PATH）→ 探活 available → 编排层即可派活。
  # 调用形态：dsh --profile headless "<任务>" — 任务文本是位置参数（headless runner 读 cmdlineArgs[0]），
  # 成功时最后一条 assistant 文本写 stdout、stderr 空、退出码 0；错误时 code+message 写 stderr、退出码 1。
  # dsh 收敛：claude_code / opencode / trae / cursor / codex / zcode / workbuddy 七个旧工具
  # 已于 2026-09-15 整体移除（只感知不派活、还占监工面板位置）。如需恢复某个工具，
  # 按下方 dsh 的结构补齐 cli 段即可。
  - id: dsh
    name: DeepSeek Harness
    type: process
    detect:
      processName: dsh
    personality:
      strengths: [自主执行, 拆解任务, 工具调用, 代码与文件操作]
      bestFor: 无人值守的自主任务（headless 一次一问一答）
      avoidFor: 需要交互式追问的长会话（headless 只提交一个任务）
      maxPromptLen: 3000
    cli:
      # 本机 dsh 是源码仓的 CLI 入口（不在 PATH），直接指到已实测可用的
      # node bin.js 包装：`node <dsh repo>/dsh-desktop-unified/node_modules/@deepseek-ai/dsh/lib/bin.js
      # --profile headless "<任务>"`。dsh.CMD 是 pnpm 生成的 node shim，taskPusher 对
      # 绝对路径 .cmd 会走 cmd.exe 包装，无需用户改 PATH。
      binary: J:\xiangm_transfer\deepseekhar_transfer\deepseekhar\dsh-desktop-unified\node_modules\.bin\dsh.CMD
      timeoutMs: 600000
      riskLevel: medium
      # 受信工具（安装即启用）：普通 CLI 派活自动放行，不弹权限确认；
      # 高风险操作（rm -rf / 等）仍强制二次确认。
      trusted: true
      # 工具级环境变量：指定 dsh home（profiles/sessions 都在其下），
      # 不设则回退 ~/.dsh。taskPusher spawn 时合并进进程 env。
      env:
        DSH_HOME: J:\xiangm_transfer\deepseekhar_transfer\deepseekhar\dsh-home
      templates:
        - key: prompt
          label: 派发任务(headless)
          args: [--profile, headless]
          inputParam: null
          maxLen: 3000
    events:
      - task_end
      - task_failed
    enabled: true

  # workforce: 预留的可扩展 agent（按需取消注释）
