# AI Provider 配置文件
# active_provider: 当前启用的 AI 模型（router 启动后由路由器自动选择）
# 修改此文件后需重启 Gateway 或通过 Web UI 配置页面保存
#
# 新增 provider 可选字段：
#   extra_body:          合并到请求体中的额外字段（如禁用 thinking、调整 reasoning_effort 等）
#   max_completion_tokens: 单次输出 token 上限（Anthropic 端点自动使用 max_tokens）
#   default_headers:      额外请求头（如 context cache 专用 header）
#   temperature:          采样温度；默认不写，由模型端决定

active_provider: "xiaomi-claude"

providers:
  # ── 本地推理模型（llamafile）──
  local:
    type: local
    display_name: 本地模型 (llamafile)
    model: qwen2.5-7b-instruct-q5_k_m.gguf
    timeout_ms: 60000

  # ── 小米 MiMo（Anthropic 原生模式）──
  # 使用 Anthropic Messages API 格式，支持 tool_use / thinking 原生调用
  xiaomi-claude:
    type: anthropic
    display_name: 小米 MiMo v2.5
    base_url: https://token-plan-cn.xiaomimimo.com/anthropic
    model: mimo-v2.5-pro
    api_key_env: MIMO_API_KEY
    timeout_ms: 120000

  # ── 小米 MiMo（OpenAI 兼容模式，备用）──
  xiaomi-mimo:
    type: openai_compatible
    display_name: Xiaomi MiMo (OpenAI Fallback)
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    model: mimo-v2.5-pro
    api_key_env: TP_API_KEY
    timeout_ms: 60000

  nvidia-nim:
    type: openai_compatible
    display_name: NVIDIA NIM
    base_url: https://integrate.api.nvidia.com/v1
    model: meta/llama-3.1-8b-instruct
    api_key_env: NVIDIA_API_KEY
    timeout_ms: 30000
    max_completion_tokens: 4096

  # ── 通义千问（阿里云 DashScope）──
  qwen:
    type: openai_compatible
    display_name: 阿里云 DashScope
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-flash
    api_key_env: DASHSCOPE_API_KEY
    timeout_ms: 30000
    extra_body:
      enable_thinking: false

  # ── Qwen3-TTS 语音合成 ──
  qwen3_tts:
    type: tts_qwen3
    display_name: Qwen3-TTS
    tts_server_url: http://127.0.0.1:5000
    tts_model_dir: "./aivoice/models/qwen3-tts"
    tts_voice: default
    tts_sample_rate: 24000

router:
  enabled: true
  mode: auto
  local_provider: local
  cloud_provider: xiaomi-claude
  fallback_provider: nvidia-nim
  # 本地小模型最大可承载的工具数（超过此数自动路由到云端）
  # qwen-1.5b 约 1.5B 参，10+ 个工具定义就会导致严重降速/超时
  local_max_tools: 10
  rules:
    # 禁用强制本地路由 — 本地 1.5B 模型太弱，无法遵循指令
    # 所有请求默认走云端，保证回答质量
    force_local:
      max_input_length: 0
      keywords: []
    force_cloud:
      min_input_length: 0
      keywords: []
  multi_turn_threshold: 5
  tool_call_threshold: 3
  image_input_route: cloud
  # 所有请求走云端，保证回答质量
  default_route: cloud
