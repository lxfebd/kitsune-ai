  permissions-prompt:
    title: 屏幕捕获
    description: 要捕获屏幕或窗口，需要屏幕和系统音频录制权限。
    open-preferences: 打开系统偏好设置
    dismiss: 取消
    instructions:
      step-1: 打开「系统首选项」，从侧边栏选择「隐私与安全」。
      step-2: 在「屏幕和系统音频录制」和「系统音频录制」部分中，开启 Kitsune AI 的开关。
      step-2-note: 如果没有列出 Kitsune AI，请通过单击「+」按钮和从应用程序文件夹中选择 Kitsune AI 来手动添加。
